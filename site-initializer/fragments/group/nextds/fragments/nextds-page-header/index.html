<section class="nextds-page-header">
  <div class="nextds-container">
    [#if configuration.showCategory]
      <p class="nextds-page-header__category" data-lfr-editable-id="category" data-lfr-editable-type="text">Category</p>
    [/#if]
    <h1 class="nextds-page-header__title" data-lfr-editable-id="title" data-lfr-editable-type="text">Page title goes here</h1>
    [#if configuration.showLead]
      <p class="nextds-page-header__lead" data-lfr-editable-id="lead" data-lfr-editable-type="rich-text">
        A short paragraph that frames the page for the visitor and tells them what they will find here.
      </p>
    [/#if]
  </div>
</section>
