[#assign v = configuration.variant!'default' /]
<span class="nextds-tag nextds-tag--${v}">
  <span data-lfr-editable-id="tag-label" data-lfr-editable-type="text">Topic</span>
  [#if configuration.removable]
    <button type="button" class="nextds-tag__remove" aria-label="Remove">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  [/#if]
</span>
